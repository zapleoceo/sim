name: SIM CI

on:
  pull_request:
    # any base branch, so stacked pull requests are verified too; deploy stays push-to-main only
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: sim_ci
          POSTGRES_PASSWORD: sim_ci_disposable_only
          POSTGRES_DB: ci_sim_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sim_ci -d ci_sim_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SIM_ENV: test
      SIM_PG_DISPOSABLE: "YES"
      SIM_PG_TEST_URL: postgresql+psycopg://sim_ci:sim_ci_disposable_only@127.0.0.1:5432/ci_sim_release_test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.13.5
      - name: Install backend from lockfile
        working-directory: backend
        run: uv sync --frozen
      - name: Install ffmpeg for offline media tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Ruff
        working-directory: backend
        run: uv run --frozen ruff check .
      - name: Backend tests (fakes for Broker and Telegram, disposable PostgreSQL)
        working-directory: backend
        run: uv run --frozen pytest -q
      - name: Migrations match the models (upgrade, autogenerate check, downgrade)
        working-directory: backend
        env:
          PYTHONPATH: .     # scripts import the `sim` package (a virtual project, not installed)
        run: uv run --frozen python scripts/ci_postgres_smoke.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend from lockfile
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint
      - name: TypeScript (app, tests and config)
        working-directory: frontend
        run: npm run typecheck
      - name: Unit and component tests (Vitest, jsdom)
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Build output in the path nginx and deploy read
        working-directory: frontend
        run: test -f dist/sim/browser/index.html
      - name: Package and verify SHA-pinned bundle
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python infra/build_release_artifact.py

  # Pull requests: product code must change together with tests and docs.
  change-gate:
    name: Tests and docs required
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Product code changes need tests and docs
        working-directory: backend
        run: >-
          python scripts/change_gate.py
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}

  # Production deploy: only for pushes to main after backend and frontend pass.
  # Gates: fresh DB backup, old worker and telegram stopped before migrations, migrations
  # (the `migrate` service) before the new processes start, readiness smoke.
  deploy:
    name: Deploy production
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sim-production-deploy
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend from the same SHA
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SIM_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SIM_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Backup database before deploy
        env:
          HOST: ${{ secrets.SIM_DEPLOY_HOST }}
          PORT: ${{ secrets.SIM_DEPLOY_PORT }}
        run: ssh -p "$PORT" -i ~/.ssh/id_ed25519 "root@$HOST" '/usr/local/bin/sim-backup.sh'
      - name: Sync committed tree and built admin
        env:
          HOST: ${{ secrets.SIM_DEPLOY_HOST }}
          PORT: ${{ secrets.SIM_DEPLOY_PORT }}
        run: |
          SSH="ssh -p $PORT -i $HOME/.ssh/id_ed25519 root@$HOST"
          $SSH 'mkdir -p /var/www/sim && cd /var/www/sim && find . -mindepth 1 -maxdepth 1 ! -name infra ! -name broker-project.json -exec rm -rf {} + && find infra -mindepth 1 ! -name .env -delete 2>/dev/null || true'
          git archive --format=tar HEAD | $SSH 'tar -x -C /var/www/sim'
          tar -cf - frontend/dist/sim/browser | $SSH 'tar -x -C /var/www/sim'
          $SSH "echo ${GITHUB_SHA} > /var/www/sim/REVISION"
      - name: Stop old worker and telegram before migrations
        env:
          HOST: ${{ secrets.SIM_DEPLOY_HOST }}
          PORT: ${{ secrets.SIM_DEPLOY_PORT }}
        run: ssh -p "$PORT" -i ~/.ssh/id_ed25519 "root@$HOST" 'cd /var/www/sim/infra && docker compose stop worker telegram'
      - name: Build and start stack (migrations run first)
        env:
          HOST: ${{ secrets.SIM_DEPLOY_HOST }}
          PORT: ${{ secrets.SIM_DEPLOY_PORT }}
        run: ssh -p "$PORT" -i ~/.ssh/id_ed25519 "root@$HOST" 'cd /var/www/sim/infra && docker compose build && docker compose up -d --remove-orphans && docker compose up -d --no-deps --force-recreate api && docker compose ps'
      - name: Readiness smoke
        env:
          HOST: ${{ secrets.SIM_DEPLOY_HOST }}
          PORT: ${{ secrets.SIM_DEPLOY_PORT }}
        run: |
          SSH="ssh -p $PORT -i $HOME/.ssh/id_ed25519 root@$HOST"
          # The api answers /readyz only when it reaches the database.
          $SSH 'for i in $(seq 1 30); do curl -fsS --max-time 5 http://127.0.0.1:8010/readyz && exit 0; sleep 2; done; exit 1'
          # worker and telegram must be running (they serve no HTTP).
          $SSH 'cd /var/www/sim/infra && sleep 5 && running="$(docker compose ps --status running --services)" && for s in api worker telegram; do echo "$running" | grep -qx "$s" || { echo "$s is not running"; docker compose logs --tail 50 "$s"; exit 1; }; done'
          # The admin bundle nginx serves is in place.
          $SSH 'grep -q "id=\"root\"" /var/www/sim/frontend/dist/sim/browser/index.html'
          $SSH 'docker exec sim-postgres psql -U sim -d sim -tAc "select version_num from alembic_version order by 1"; cat /var/www/sim/REVISION'
      - name: Remove key material
        if: always()
        run: rm -f ~/.ssh/id_ed25519
