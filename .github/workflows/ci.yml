name: SIM CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: sim_ci
          POSTGRES_PASSWORD: sim_ci_disposable_only
          POSTGRES_DB: ci_sim_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sim_ci -d ci_sim_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SIM_ENV: test
      SIM_PG_DISPOSABLE: "YES"
      SIM_PG_TEST_URL: postgresql+asyncpg://sim_ci:sim_ci_disposable_only@127.0.0.1:5432/ci_sim_release_test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.13.5
      - name: Install backend from lockfile
        working-directory: backend
        run: uv sync --frozen
      - name: Backend unit tests
        working-directory: backend
        run: uv run --frozen pytest -q
      - name: Ruff
        working-directory: backend
        run: uv run --frozen ruff check .
      - name: Disposable PostgreSQL migration and concurrency gate
        working-directory: backend
        run: uv run --frozen python scripts/ci_postgres_smoke.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend from lockfile
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npx --no-install ng lint
      - name: TypeScript app and spec
        working-directory: frontend
        run: |
          npx --no-install tsc -p tsconfig.app.json --noEmit
          npx --no-install tsc -p tsconfig.spec.json --noEmit
      - name: Browser unit tests
        working-directory: frontend
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          npm test -- --watch=false --browsers=ChromeHeadless
      - name: Save CI-built frontend
        uses: actions/upload-artifact@v4
        with:
          name: sim-frontend-dist
          path: frontend/dist/sim/browser/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Verified release artifact
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore CI-built frontend
        uses: actions/download-artifact@v4
        with:
          name: sim-frontend-dist
          path: frontend/dist/sim/browser
      - name: Package and verify release
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python infra/build_release_artifact.py
      - name: Publish verified release
        id: release_upload
        uses: actions/upload-artifact@v4
        with:
          name: sim-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release-output/sim-release-*.tar
            release-output/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Record artifact identity
        env:
          ARTIFACT_ID: ${{ steps.release_upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.release_upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.release_upload.outputs.artifact-digest }}
        run: |
          echo "Artifact ID: $ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact URL: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact digest: $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
