[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# The URL comes from SIM_DATABASE_URL (see migrations/env.py), never from this file.

# Two migration branches (docs/deploy.md):
#   sim            - our revisions, migrations/versions (0001_initial, ...)
#   procrastinate  - the job queue schema, shipped by Procrastinate (procrastinate.contrib.alembic)
# Apply both with `alembic upgrade heads`. New SIM revision:
#   alembic revision -m "what changes" --head sim@head
path_separator = newline
version_locations =
    %(here)s/migrations/versions
    procrastinate.contrib.alembic:versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
