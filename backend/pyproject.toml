[project]
name = "sim"
version = "2.0.0"
description = "SIM v2: one AI persona in Telegram — text, voice, media understanding, generated photo/video, live calls"
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]>=2.15,<3",
    "advanced-alchemy>=1.4,<2",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "procrastinate>=3.0,<4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "websockets>=13",
    "cryptography>=43",
    "telethon==1.45.0",
    "python-socks[asyncio]>=3.2.1",
    "py-tgcalls>=2.1,<4",
    "filetype>=1.2",
    "pypdf>=5",
    "python-docx>=1.1",
    "uvloop>=0.21; sys_platform != 'win32'",
    "segno>=1.6,<2",
    # Instagram Direct (private API), imported lazily: only an Instagram channel loads it.
    "instagrapi>=2.16,<2.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
