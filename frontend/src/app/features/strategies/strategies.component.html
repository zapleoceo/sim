<div class="sim-page">
  <sim-page-header title="Стратегии" subtitle="Сценарий общения: цель, оффер, правила и playbook по этапам">
    <a mat-flat-button routerLink="/strategies/new">
      <mat-icon class="material-icons-outlined">add</mat-icon>
      Новая стратегия
    </a>
  </sim-page-header>

  <div class="list">
    @for (s of strategies(); track s.id) {
      <a class="sim-card item" [routerLink]="['/strategies', s.id]">
        <strong>{{ s.name }}</strong>
        <span class="sim-muted">{{ s.partner_name || 'Партнёр не указан' }}</span>
      </a>
    } @empty {
      @if (loaded()) {
        <sim-empty-state icon="route" title="Стратегий пока нет" hint="Создайте первую, чтобы привязать её к персонажу." />
      }
    }
  </div>
</div>
