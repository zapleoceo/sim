<div class="shell">
  <mat-sidenav-container class="container" [autosize]="true">
    <mat-sidenav
      class="side"
      [class.rail]="isRail()"
      [mode]="isPhone() ? 'over' : 'side'"
      [opened]="!isPhone() || drawerOpen()"
      [fixedInViewport]="isPhone()"
      [disableClose]="!isPhone()"
      (closedStart)="closeDrawer()"
      [attr.aria-label]="'Основная навигация'"
    >
      <div class="side-inner">
      <a class="brand" routerLink="/" (click)="closeDrawer()">
        <span class="logo" aria-hidden="true">S</span>
        @if (!isRail()) {
          <span>Sim</span>
        }
      </a>
      <mat-nav-list class="nav" aria-label="Разделы">
        @for (item of items(); track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive
            #rla="routerLinkActive"
            [activated]="rla.isActive"
            [attr.aria-current]="rla.isActive ? 'page' : null"
            [attr.aria-label]="item.label"
            [matTooltip]="isRail() ? item.label : ''"
            matTooltipPosition="right"
            (click)="closeDrawer()"
          >
            <mat-icon matListItemIcon class="material-icons-outlined">{{ item.icon }}</mat-icon>
            @if (!isRail()) {
              <span matListItemTitle>{{ item.label }}</span>
            }
          </a>
        }
      </mat-nav-list>
      <div class="user">
        <div class="who-row" [matTooltip]="isRail() ? userName() + ' · ' + roleLabel() : ''" matTooltipPosition="right">
          <sim-avatar [name]="userName()" [url]="user()?.photo_url || null" [size]="32" />
          @if (!isRail()) {
            <div class="who">
              <strong>{{ userName() }}</strong>
              <span class="sim-muted">{{ roleLabel() }}</span>
            </div>
          }
        </div>
        <button mat-icon-button type="button" aria-label="Выйти" (click)="logout()">
          <mat-icon class="material-icons-outlined">logout</mat-icon>
        </button>
      </div>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="content" id="main">
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>

  @if (isPhone()) {
    <nav class="bottom" aria-label="Быстрая навигация">
      @for (item of bottomItems(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="tab">
          <mat-icon class="material-icons-outlined">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
      <button type="button" class="tab" (click)="toggleDrawer()" aria-haspopup="dialog" [attr.aria-expanded]="drawerOpen()">
        <mat-icon class="material-icons-outlined">menu</mat-icon>
        <span>Ещё</span>
      </button>
    </nav>
  }
</div>
