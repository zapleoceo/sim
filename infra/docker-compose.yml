name: sim

# SIM v2 on the prod host (/var/www/sim, docs/deploy.md). Only the api is published, and only on
# loopback: nginx serves the admin and proxies /api to it. Postgres stays inside the compose
# network. No Redis and no Evolution/WhatsApp: the job queue (Procrastinate) and live updates
# (LISTEN/NOTIFY) are in Postgres.
#
# Container and volume names are the v1 ones on purpose (sim-postgres for sim-backup.sh, sim_media
# for the files), but v2 starts on a CLEAN sim_pgdata volume: the first rollout removes the v1
# volumes (docs/deploy.md, "Первый выкат").
#
# Memory: the host has 7.7 GB shared with other apps; these limits sum to about 2.3 GB.

x-app: &app
  image: sim-backend:latest
  env_file: [.env]
  environment:
    SIM_ENV: prod
    SIM_DATABASE_URL: postgresql+psycopg://sim:${POSTGRES_PASSWORD}@postgres:5432/sim
    SIM_MEDIA_DIR: /app/media
    SIM_STATIC_DIR: /app/static
  volumes:
    - sim_media:/app/media
  depends_on:
    postgres: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: sim-postgres
    environment:
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: sim
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=60"]
    volumes:
      - sim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim -d sim"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
    mem_limit: 384m
    restart: unless-stopped

  # Schema (both Alembic branches: SIM and Procrastinate) and seed, before any process starts.
  migrate:
    <<: *app
    build: ../backend
    container_name: sim-migrate
    command: ["sh", "-c", "alembic upgrade heads && python -m sim.seed"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      disable: true
    mem_limit: 256m
    restart: "no"

  api:
    <<: *app
    container_name: sim-api
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - sim_media:/app/media
      - ../frontend/dist/sim/browser:/app/static:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)"]
      interval: 20s
      timeout: 6s
      start_period: 30s
      retries: 3
    mem_limit: 384m

  # Model calls, recognition, generation, ffmpeg (Procrastinate queue `agent`).
  worker:
    <<: *app
    container_name: sim-worker
    command: ["python", "-m", "sim.apps.worker"]
    healthcheck:
      disable: true
    stop_grace_period: 60s
    mem_limit: 768m

  # The Telegram account: receive, send, calls (Procrastinate queue `telegram`). One instance only:
  # two processes on one StringSession would fight over the account.
  telegram:
    <<: *app
    container_name: sim-telegram
    command: ["python", "-m", "sim.apps.telegram"]
    healthcheck:
      disable: true
    stop_grace_period: 30s
    mem_limit: 512m

volumes:
  sim_pgdata:
  sim_media:
