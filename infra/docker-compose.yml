name: sim

# SIM v2 on the prod host (/var/www/sim, docs/deploy.md). Only the api is published, and only on
# loopback: nginx serves the admin and proxies /api to it. Postgres stays inside the compose
# network. No Redis: the job queue (Procrastinate) and live updates (LISTEN/NOTIFY) are in
# Postgres. WhatsApp (Evolution API) is OFF by default: its services are in the `whatsapp`
# profile and start only when infra/.env has COMPOSE_PROFILES=whatsapp (docs/deploy.md,
# «WhatsApp»). Instagram needs no service: the worker polls it (queue `channels`).
#
# Container and volume names are the v1 ones on purpose (sim-postgres for sim-backup.sh, sim_media
# for the files), but v2 starts on a CLEAN sim_pgdata volume: the first rollout removes the v1
# volumes (docs/deploy.md, "Первый выкат").
#
# Memory: the host has 7.7 GB shared with other apps; these limits sum to about 2.3 GB.

x-app: &app
  image: sim-backend:latest
  env_file: [.env]
  environment:
    SIM_ENV: prod
    SIM_DATABASE_URL: postgresql+psycopg://sim:${POSTGRES_PASSWORD}@postgres:5432/sim
    SIM_MEDIA_DIR: /app/media
    SIM_STATIC_DIR: /app/static
  volumes:
    - sim_media:/app/media
  depends_on:
    postgres: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: sim-postgres
    environment:
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: sim
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=60"]
    volumes:
      - sim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim -d sim"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
    mem_limit: 384m
    restart: unless-stopped

  # Schema (both Alembic branches: SIM and Procrastinate) and seed, before any process starts.
  migrate:
    <<: *app
    build: ../backend
    container_name: sim-migrate
    command: ["sh", "-c", "alembic upgrade heads && python -m sim.seed"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      disable: true
    mem_limit: 256m
    restart: "no"

  api:
    <<: *app
    container_name: sim-api
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - sim_media:/app/media
      - ../frontend/dist/sim/browser:/app/static:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)"]
      interval: 20s
      timeout: 6s
      start_period: 30s
      retries: 3
    mem_limit: 384m

  # Model calls, recognition, ffmpeg (Procrastinate queue `agent`) and generation (queue `media`,
  # its own worker in the same process, sim/apps/worker.py).
  worker:
    <<: *app
    container_name: sim-worker
    command: ["python", "-m", "sim.apps.worker"]
    healthcheck:
      disable: true
    stop_grace_period: 60s
    mem_limit: 768m

  # The Telegram account: receive, send, calls (Procrastinate queue `telegram`). One instance only:
  # two processes on one StringSession would fight over the account.
  telegram:
    <<: *app
    container_name: sim-telegram
    command: ["python", "-m", "sim.apps.telegram"]
    healthcheck:
      disable: true
    stop_grace_period: 30s
    mem_limit: 512m

  # --- WhatsApp: only with the `whatsapp` profile (COMPOSE_PROFILES=whatsapp in infra/.env) ---

  # Evolution keeps its own database `evolution` in the same Postgres; made once, idempotent.
  evolution-init:
    image: postgres:16.6-alpine
    container_name: sim-evolution-init
    profiles: ["whatsapp"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    command: ["sh", "-c", "psql -h postgres -U sim -d sim -tAc \"SELECT 1 FROM pg_database WHERE datname = 'evolution'\" | grep -q 1 || psql -h postgres -U sim -d sim -c 'CREATE DATABASE evolution'"]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 64m
    restart: "no"

  # WhatsApp as a linked device (Baileys). Reached only inside the compose network: SIM calls
  # http://evolution:8080 with the API key, Evolution posts events to http://api:8000/api/hooks.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: sim-evolution
    profiles: ["whatsapp"]
    environment:
      SERVER_URL: http://evolution:8080
      # Not `:?`: compose interpolates every service, enabled or not, and a required variable
      # would break the normal deploy without the profile. Set it in infra/.env (docs/deploy.md).
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      # connection_limit: Postgres has max_connections=60 for everything (SIM pools included).
      DATABASE_CONNECTION_URI: postgresql://sim:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public&connection_limit=5
      DATABASE_CONNECTION_CLIENT_NAME: sim
      # Stored messages feed the catch-up after a reconnect (POST /chat/findMessages).
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      # The name in «Связанные устройства» on the phone: an unknown device there looks like a
      # hijack and gets unlinked (docs/channels.md).
      CONFIG_SESSION_PHONE_CLIENT: ${EVOLUTION_DEVICE_NAME:-SIM}
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "10"
      WEBHOOK_GLOBAL_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN
    volumes:
      - sim_evolution:/evolution/instances
    depends_on:
      postgres: {condition: service_healthy}
      evolution-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
    mem_limit: 512m
    restart: unless-stopped

volumes:
  sim_pgdata:
  sim_media:
  sim_evolution:
