# /etc/nginx/sites-enabled/sim
# Cloudflare proxies sim.zapleo.com → us on :80 (same Flexible mode as aib.zapleo.com).
limit_req_zone $binary_remote_addr zone=sim_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sim_api:10m rate=600r/m;

server {
    listen 80;
    server_name sim.zapleo.com;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 20m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Evolution calls the API inside the docker network; never from the internet.
    location /hooks/evolution/ { return 404; }

    # Both session-creating routes share the per-client login budget. Keep read/logout
    # endpoints on the general limit; query strings do not affect exact location matches.
    location = /api/auth/telegram {
        limit_req zone=sim_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /api/auth/link {
        limit_req zone=sim_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=sim_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
