# /etc/nginx/sites-enabled/sim — SIM v2 (docs/deploy.md). Installed by hand, not by the deploy job.
# Cloudflare proxies sim.zapleo.com -> us on :80 (same Flexible mode as aib.zapleo.com).
# nginx serves the built admin from the deploy tree and proxies /api to the api container
# (127.0.0.1:8010). /healthz and /readyz stay internal (the deploy smoke calls them on 8010).
# If the live config includes the origin TLS / audit snippets (infra/nginx/), keep those includes.
limit_req_zone $binary_remote_addr zone=sim_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sim_api:10m rate=600r/m;

server {
    listen 80;
    server_name sim.zapleo.com;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    root /var/www/sim/frontend/dist/sim/browser;
    index index.html;

    # Media uploads to the library (photos, videos) go through /api/media.
    client_max_body_size 60m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The only session-creating route: its own per-client budget.
    location = /api/auth/telegram {
        limit_req zone=sim_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Server-Sent Events: no buffering, a long read timeout, HTTP/1.1 keep-alive upstream.
    location = /api/events {
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        limit_req zone=sim_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Vite assets have content hashes in their names: cache for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # index.html is never cached, so a deploy is picked up on the next load.
    location = /index.html {
        expires -1;
    }

    # Client-side routes (/chats/12, /persona, ...) all load the admin.
    location / {
        try_files $uri /index.html;
    }
}
