# A separate rsyslog process: no /dev/log, journal, network or global rules.
# Raw nginx errors stay in memory; no disk queues, forwarding or raw templates.
module(load="imuxsock" SysSock.Use="off")
template(name="simSafeError" type="string"
    string="{\"at\":\"%timegenerated:::date-rfc3339%\",\"severity\":\"%syslogseverity-text%\",\"event\":\"nginx_error\",\"details\":\"redacted\"}\n")
ruleset(name="simErrors") {
    action(type="omfile" file="/var/log/sim-nginx/error-audit.log"
           template="simSafeError" fileCreateMode="0640")
    stop
}
input(type="imuxsock" Socket="/run/sim-nginx-audit/socket"
      CreatePath="off" RateLimit.Interval="0" ruleset="simErrors")
