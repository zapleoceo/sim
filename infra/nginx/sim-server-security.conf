# Included only inside server_name sim.zapleo.com. Keep its existing HTTP listener.
# Do not add default_server or change the lbot/443 listeners.
listen 8443 ssl http2;
ssl_certificate /etc/ssl/lbot/lbot.crt;
ssl_certificate_key /etc/ssl/lbot/lbot.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

access_log /var/log/sim-nginx/access-audit.log sim_private_audit;
error_log syslog:server=unix:/run/sim-nginx-audit/socket,tag=sim_nginx,nohostname warn;
